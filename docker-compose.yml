version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_utveckling
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_LOCAL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_LOCAL_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
