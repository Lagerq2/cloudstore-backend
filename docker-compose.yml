version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_utveckling
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_LOCAL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_LOCAL_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: cloudstore_backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env

    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_LOCAL_NAME}?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_LOCAL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db

volumes:
  mysql_data:
